services:
  home-netflix:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Booth log in the frontends. `DEBUG=true docker compose up` turns it on
      # for one run; set DEBUG in .env to make it stick.
      - DEBUG=${DEBUG:-false}
      - URL=${URL:-}

    volumes:
      - ./Movies:/app/Movies
      - ./Covers:/app/Covers
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ~/Videos:/root/Videos
      - type : bind
        source : /media
        target : /media
        bind:
          propagation : rshared